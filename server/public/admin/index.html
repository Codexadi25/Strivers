<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Strivers Server Control Center | Backend Admin GUI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;700;800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin/admin.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%232f4bff'/><path d='M30 65L50 25L70 65H58L50 48L42 65Z' fill='white'/></svg>">
  <script>
    (function() {
      try {
        var theme = localStorage.getItem('strivers_admin_theme') || 'dark';
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- AUTH SCREEN (Rendered by AuthPageView) -->
  <div id="auth-screen" class="auth-screen"></div>

  <!-- MAIN DASHBOARD GUI (Shown after authenticated) -->
  <div id="admin-app" class="admin-app hidden">
    <!-- Sidebar Navigation (Rendered by SidebarView) -->
    <aside class="sidebar" id="sidebar-container"></aside>

    <!-- Main Content Area -->
    <main class="main-content">
      <!-- Top Header Telemetry Strip (Rendered by TopbarView) -->
      <header class="topbar" id="topbar-container"></header>

      <!-- Tab Panes Container (Rendered by Page Views) -->
      <div id="pages-container"></div>
    </main>
  </div>

  <!-- MODALS CONTAINER (Rendered by ModalsView) -->
  <div id="modals-container"></div>

  <!-- Modular MVC Application Bootstrap -->
  <script type="module" src="/admin/admin.js?v=2.5"></script>
</body>
</html>
